# =============================================================================
# Пример конфигурации nginx для портала мероприятий Colvir.
#
# Задачи прокси:
#   1. Терминировать TLS (AD-пароли и cookie сессии не ходят по http).
#   2. Выполнять Kerberos/SPNEGO-негошиэйшн и передавать имя пользователя.
#   3. Гарантировать, что клиент не может подделать заголовок X-Remote-User.
#
# Для Kerberos требуется модуль spnego-http-auth-nginx-module
# (в Debian/Ubuntu — пакет libnginx-mod-http-auth-spnego).
# =============================================================================

upstream colvir_events {
    # Node слушает только внутренний интерфейс/сеть docker и НЕ должен быть
    # доступен из корпоративной сети напрямую — иначе SSO-заголовок можно
    # выставить в обход прокси.
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name events.colvir.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name events.colvir.com;

    # Сертификат внутреннего CA компании либо Let's Encrypt,
    # если домен резолвится публично.
    ssl_certificate     /etc/ssl/colvir/events.colvir.com.crt;
    ssl_certificate_key /etc/ssl/colvir/events.colvir.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Изображения мероприятий передаются как data:URL
    client_max_body_size 12m;

    # -------------------------------------------------------------------------
    # КЛЮЧЕВОЕ ПРАВИЛО БЕЗОПАСНОСТИ
    #
    # Заголовок с именем пользователя обязан формировать только прокси.
    # Пустое значение стирает всё, что прислал клиент, — иначе любой сотрудник
    # мог бы отправить `X-Remote-User: admin@colvir.com` и войти кем угодно.
    # -------------------------------------------------------------------------
    proxy_set_header X-Remote-User "";

    location / {
        proxy_pass http://colvir_events;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Сквозной вход по билету Kerberos рабочей станции.
    #
    # На стороне приложения включите:
    #   SSO_ENABLED=true
    #   SSO_TRUSTED_PROXIES=127.0.0.1        (адрес, с которого прокси стучится в Node)
    #   TRUST_PROXY_HOPS=1
    # -------------------------------------------------------------------------
    location /api/auth/ad/sso {
        auth_gss on;
        auth_gss_keytab /etc/nginx/krb5.keytab;
        auth_gss_realm COLVIR.COM;
        auth_gss_service_name HTTP/events.colvir.com;
        # Не отдавать сервисный тикет клиенту
        auth_gss_allow_basic_fallback off;

        proxy_pass http://colvir_events;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # $remote_user заполняет модуль Kerberos после успешной проверки билета.
        proxy_set_header X-Remote-User     $remote_user;
    }

    # Статика фронтенда отдаётся приложением; кеш держим на уровне прокси.
    location /assets/ {
        proxy_pass http://colvir_events;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
